name: GTA V Recomp - Linux Portable

on:
  push:
    branches:
      - perf-linux
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux x86_64 Portable
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      LLVM_VERSION: 19.1.5
      LLVM_SHA256: 13e9975b026d431c945927960e5f8c0a47a155a2f600f57e85f4d1482620c65f
      JOBS: 4

    steps:
      # --------------------------------------------------
      # 1. Checkout du véritable code source
      # --------------------------------------------------

      - name: Checkout perf-linux
        uses: actions/checkout@v4
        with:
          ref: perf-linux
          fetch-depth: 0
          fetch-tags: true

      - name: Verify branch
        run: |
          git status --short
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current)"
          test "$(git branch --show-current)" = "perf-linux"

      # --------------------------------------------------
      # 2. Récupération des dépendances externes
      # --------------------------------------------------

      - name: Checkout ReXGlue SDK
        run: |
          set -euo pipefail

          git clone \
            --branch v0.10.0 \
            --recurse-submodules \
            https://github.com/rexglue/rexglue-sdk.git \
            rexglue-sdk

          echo "=== ReXGlue version ==="
          git -C rexglue-sdk describe --tags --always

          echo "=== ReXGlue submodules ==="
          git -C rexglue-sdk submodule status --recursive

          if git -C rexglue-sdk submodule status --recursive | grep -q '^-'; then
            echo "::error::ReXGlue has uninitialized submodules"
            exit 1
          fi

          if ! find rexglue-sdk/thirdparty \
            -type d -iname cli11 -print -quit | grep -q .; then
            echo "::error::CLI11 was not found in ReXGlue"
            exit 1
          fi

      - name: Checkout XenosRecomp
        run: |
          set -euo pipefail

          mkdir -p thirdparty

          git clone --recurse-submodules \
            https://github.com/hedge-dev/XenosRecomp.git \
            thirdparty/XenosRecomp

          echo "XenosRecomp commit:"
          git -C thirdparty/XenosRecomp rev-parse HEAD

          git -C thirdparty/XenosRecomp apply --check \
            "$GITHUB_WORKSPACE/xenosrecomp-gtav.patch"

          git -C thirdparty/XenosRecomp apply \
            "$GITHUB_WORKSPACE/xenosrecomp-gtav.patch"

      - name: Checkout Plume
        run: |
          set -euo pipefail

          git clone --recurse-submodules \
            https://github.com/renderbag/plume.git \
            thirdparty/plume

          echo "Plume commit:"
          git -C thirdparty/plume rev-parse HEAD

          git -C thirdparty/plume apply --check \
            "$GITHUB_WORKSPACE/plume-gtav.patch"

          git -C thirdparty/plume apply \
            "$GITHUB_WORKSPACE/plume-gtav.patch"

      # --------------------------------------------------
      # 3. Application du patch ReXGlue
      # --------------------------------------------------

      - name: Patch ReXGlue SDK
        run: |
          set -euo pipefail

          git -C rexglue-sdk apply --check \
            "$GITHUB_WORKSPACE/rexglue-sdk-gtav-linux.patch"

          git -C rexglue-sdk apply \
            "$GITHUB_WORKSPACE/rexglue-sdk-gtav-linux.patch"

          echo "=== Dependencies verification ==="

          test -f rexglue-sdk/CMakeLists.txt
          test -f rexglue-sdk/thirdparty/CMakeLists.txt

          if git -C rexglue-sdk submodule status --recursive | grep -q '^-'; then
            echo "::error::A ReXGlue submodule is still missing"
            exit 1
          fi

          echo "All external sources are ready."

      - name: Display dependency revisions
        run: |
          echo "=== Dependency revisions ==="
          git -C rexglue-sdk rev-parse HEAD
          git -C thirdparty/XenosRecomp rev-parse HEAD
          git -C thirdparty/plume rev-parse HEAD

      # --------------------------------------------------
      # 4. Host tools
      # --------------------------------------------------

      - name: Verify host tools
        run: |
          docker --version
          git --version
          cmake --version
          python3 --version
          curl --version
          readelf --version
          ninja --version

      # --------------------------------------------------
      # 5. LLVM 19.1.5 pour le package final
      # --------------------------------------------------

      - name: Download LLVM 19.1.5
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"

          curl -fL --retry 5 --retry-all-errors \
            "$URL" \
            -o "$RUNNER_TEMP/llvm.tar.xz"

          echo "$LLVM_SHA256  $RUNNER_TEMP/llvm.tar.xz" \
            | sha256sum -c -

          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" \
            -C "$RUNNER_TEMP"

          LLVM_DIR="$RUNNER_TEMP/LLVM-${LLVM_VERSION}-Linux-X64"

          test -x "$LLVM_DIR/bin/clang-19"
          test -x "$LLVM_DIR/bin/lld"

          echo "LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 6. Licences
      # --------------------------------------------------

      - name: Prepare licenses
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/licenses/third_party"

          curl -fL --retry 5 \
            https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-19.1.5/llvm/LICENSE.TXT \
            -o "$RUNNER_TEMP/licenses/LLVM.txt"

          curl -fL --retry 5 \
            https://raw.githubusercontent.com/microsoft/DirectXShaderCompiler/main/LICENSE.TXT \
            -o "$RUNNER_TEMP/licenses/DirectXShaderCompiler.txt"

          cp /usr/share/common-licenses/GPL-3 \
            "$RUNNER_TEMP/licenses/third_party/GPL-3.0.txt"

      # --------------------------------------------------
      # 7. Construction de l'image Docker portable
      # --------------------------------------------------

      - name: Build compatibility Docker image
        run: |
          docker build --pull \
            -t gtav-compat-build:22.04 \
            tools/release/compat

      # --------------------------------------------------
      # 8. Compilation complète
      # --------------------------------------------------

      - name: Build portable binaries
        shell: bash
        run: |
          set -euo pipefail

          chmod +x tools/release/compat/build.sh

          JOBS="$JOBS" tools/release/compat/build.sh

      # --------------------------------------------------
      # 9. Création du package Linux
      # --------------------------------------------------

      - name: Create Linux release package
        run: |
          set -euo pipefail

          python3 tools/release/make_release_linux.py \
            "$RUNNER_TEMP/gtav-recomp-linux-x64" \
            --llvm "$LLVM_DIR" \
            --expected tools/release/expected.txt \
            --licenses "$RUNNER_TEMP/licenses" \
            --compat \
            --tar

      # --------------------------------------------------
      # 10. Vérification du package
      # --------------------------------------------------

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$RUNNER_TEMP/gtav-recomp-linux-x64"

          for file in \
            gtav_launcher \
            gtav_fast \
            librexruntime.so \
            librexgpu-xenos.so \
            libTracyClient.so \
            rexglue \
            tools/XenosRecomp \
            tools/dxc \
            tools/dxc-linux \
            tools/lib/libdxcompiler.so \
            tools/llvm/bin/clang++ \
            tools/llvm/bin/ld.lld \
            tools/llvm/lib/libxml2.so.2
          do
            if [ ! -x "$PACKAGE/$file" ]; then
              echo "::error::Missing executable: $file"
              exit 1
            fi
          done

          test -f "$RUNNER_TEMP/gtav-recomp-linux-x64.tar.gz"

          echo "=== Package contents ==="
          tar -tzf "$RUNNER_TEMP/gtav-recomp-linux-x64.tar.gz" \
            | sed -n '1,40p'

          echo "=== SHA256 ==="
          sha256sum "$RUNNER_TEMP/gtav-recomp-linux-x64.tar.gz"

      # --------------------------------------------------
      # 11. Upload
      # --------------------------------------------------

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtav-recomp-linux-x64
          path: ${{ runner.temp }}/gtav-recomp-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
