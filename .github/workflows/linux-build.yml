
name: Build GTA V Recomp - Linux

on:
  push:
    branches:
      - max-perf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-xcb-dev \
            cmake \
            ninja-build \
            libxss-dev \
            git \
            python3 \
            python3-pip \
            curl \
            xz-utils \
            pkg-config \
            libvulkan-dev \
            vulkan-tools \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libdbus-1-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            libxml2-dev

      - name: Install LLVM 19.1.5
        shell: bash
        run: |
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.5/LLVM-19.1.5-Linux-X64.tar.xz"

          mkdir -p "$RUNNER_TEMP/llvm"
          curl -L "$LLVM_URL" -o "$RUNNER_TEMP/llvm.tar.xz"

          tar -xf "$RUNNER_TEMP/llvm.tar.xz" \
            --strip-components=1 \
            -C "$RUNNER_TEMP/llvm"

          test -x "$RUNNER_TEMP/llvm/bin/clang++"
          test -x "$RUNNER_TEMP/llvm/bin/lld"

      - name: Fetch and prepare ReXGlue SDK
        run: |
          mkdir -p "$RUNNER_TEMP/deps"

          git clone --recurse-submodules \
            https://github.com/rexglue/rexglue-sdk.git \
            "$RUNNER_TEMP/deps/rexglue-sdk"

          cd "$RUNNER_TEMP/deps/rexglue-sdk"
          git checkout f5337cd
          git submodule update --init --recursive

          git apply "$GITHUB_WORKSPACE/rexglue-sdk-gtav-linux.patch"

          mkdir -p "$GITHUB_WORKSPACE/rexglue-sdk"

          cp LICENSE "$GITHUB_WORKSPACE/rexglue-sdk/LICENSE"
          cp -a thirdparty "$GITHUB_WORKSPACE/rexglue-sdk/"

      - name: Build and install ReXGlue
        run: |
          cd "$RUNNER_TEMP/deps/rexglue-sdk"

          cmake --preset linux-amd64 \
            -DREXGLUE_ENABLE_TRACY=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/rexglue-sdk/out/install/linux-amd64"

          cmake --build out/build/linux-amd64 --parallel 2

          cmake --install out/build/linux-amd64

      - name: Fetch and prepare XenosRecomp
        run: |
          git clone --recurse-submodules \
            https://github.com/hedge-dev/XenosRecomp.git \
            "$RUNNER_TEMP/deps/XenosRecomp"

          cd "$RUNNER_TEMP/deps/XenosRecomp"
          git checkout 990d03b
          git submodule update --init --recursive

          git apply "$GITHUB_WORKSPACE/xenosrecomp-gtav.patch"

          mkdir -p "$GITHUB_WORKSPACE/thirdparty"
          cp -a "$RUNNER_TEMP/deps/XenosRecomp" \
            "$GITHUB_WORKSPACE/thirdparty/XenosRecomp"

      - name: Fetch and prepare Plume
        run: |
          git clone --recurse-submodules \
            https://github.com/renderbag/plume.git \
            "$RUNNER_TEMP/deps/plume"

          cd "$RUNNER_TEMP/deps/plume"
          git checkout 0ce184b
          git submodule update --init --recursive

          git apply "$GITHUB_WORKSPACE/plume-gtav.patch"

          cp -a "$RUNNER_TEMP/deps/plume" \
            "$GITHUB_WORKSPACE/thirdparty/plume"

      - name: Build XenosRecomp
        run: |
          cmake -S thirdparty/XenosRecomp \
            -B build/xenosrecomp \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

          cmake --build build/xenosrecomp \
            --target XenosRecomp \
            --parallel 2

      - name: Build GTA V runtime
        run: |
          cmake -S gtav -B build-dll -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_LINKER="$(command -v ld.lld)" \
            -DGTAV_GAME_DLL=ON \
            -Drexglue_DIR="$GITHUB_WORKSPACE/rexglue-sdk/out/install/linux-amd64/lib/cmake/rexglue" \
            -DSDL3_DIR="$GITHUB_WORKSPACE/rexglue-sdk/out/install/linux-amd64/lib/cmake/SDL3"

          cmake --build build-dll --parallel 2

      - name: Build launcher
        run: |
          cmake -S loader -B build-launcher -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++

          cmake --build build-launcher --parallel 2

      - name: Package Linux release
        run: |
          python3 tools/release/make_release_linux.py \
            release-linux \
            --llvm "$RUNNER_TEMP/llvm" \
            --expected tools/release/expected.txt \
            --licenses licenses \
            --tar

      - name: Check release files
        run: |
          test -f release-linux.tar.gz
          test -x release-linux/gtav_launcher
          test -x release-linux/gtav_fast

          file release-linux/gtav_launcher
          file release-linux/gtav_fast

          ldd release-linux/gtav_launcher
          ldd release-linux/gtav_fast

      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: gtav-recomp-linux-x64
          path: release-linux.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
